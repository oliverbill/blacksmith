# Activates the Claude Agent SDK (subscription-backed, via the local `claude` CLI, from the
# reusable com.oliversoft:claude-cli-chat-model library) as the sole Developer-agent provider,
# in place of MiniMax/OpenRouter, with no fallback chain. Never active in prod (Hostinger VPS
# runs with claude-cli.enabled unset/false).
claude-cli.enabled=true
claude-cli.executable=claude
claude-cli.mcp-server-key=blacksmith-dev
claude-cli.mcp-server-url=http://localhost:${server.port}/sse
claude-cli.allowed-tools=mcp__blacksmith-dev__listFiles,mcp__blacksmith-dev__readFile,mcp__blacksmith-dev__grep,mcp__blacksmith-dev__readFileSection,mcp__blacksmith-dev__getFileInfo
claude-cli.timeout-seconds=300
claude-cli.keychain-account=${user.name}
claude-cli.keychain-service=blacksmith-claude-oauth-token
